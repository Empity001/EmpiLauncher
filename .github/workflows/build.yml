name: Build

on: push

jobs:
  release:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Install Dependencies
        run: npm ci
        shell: bash

      # This only checks that the classic launcher still builds. It must NEVER publish: with GH_TOKEN, electron-builder uploads its
      # artifacts to a draft release of the same version if one exists, and the Publisher creates exactly such a draft (holding the native
      # installer, which has the same file name) while this job is still running. They collided: the draft was replaced under the
      # Publisher's upload ("HTTP 404 ... releases/<id>/assets") and the v3.4.0 release could not be created.
      - name: Build
        run: npm run dist -- --publish never
        shell: bash