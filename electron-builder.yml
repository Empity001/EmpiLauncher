appId: 'empilauncher'
productName: 'Empi Launcher'
artifactName: '${productName}-setup-${version}.${ext}'

publish:
  provider: github
  owner: Empity001
  repo: EmpiLauncher
  
copyright: 'Copyright © 2026 Empity'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'
  - '!.github/**'
  - '!tools/**'

extraResources:
  - 'libraries'

# Windows Configuration
win:
  icon: 'build/icon.ico'
  target:
    - target: 'nsis'
      arch:
        - 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

  installerIcon: 'build/icon.ico'
  uninstallerIcon: 'build/icon.ico'
  installerHeaderIcon: 'build/icon.ico'

  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 'Empi Launcher'

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'Empity001'
  vendor: 'Empity001'
  synopsis: 'EmpiLauncher'
  description: 'Launcher personalizado de EmpiLauncher: instala y actualiza mods, configuraciones y el juego automaticamente.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'
